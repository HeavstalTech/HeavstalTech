<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- 
    Timeless, solid blue Tech Vortex.
    No letters, no gradients, pure geometric shape.
  -->
  <g fill="none" stroke="#0665a4" stroke-width="34" stroke-linecap="round" transform="translate(200, 200)">
    <!-- Base sweeping arm -->
    <path d="M 0, 55 A 110 110 0 0 1 150, -50" id="arm"/>
    
    <!-- Seamless radial rotation to form the spiral -->
    <use href="#arm" transform="rotate(60)" />
    <use href="#arm" transform="rotate(120)" />
    <use href="#arm" transform="rotate(180)" />
    <use href="#arm" transform="rotate(240)" />
    <use href="#arm" transform="rotate(300)" />
  </g>
</svg>
