<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- 
    Heavstal Tech: Geometric Sunburst/Sunflower
    Approach: Concentric layers of FILLED geometric petals.
  -->
  <g transform="translate(200, 200)">
    
    <!-- OUTER LAYER: 12 thinner, spread-out petals for the "sunflower" edge -->
    <g fill="#0665a4">
      <path d="M 0,0 Q 30,-80 0,-120 Q -30,-80 0,0" transform="rotate(0)" />
      <path d="M 0,0 Q 30,-80 0,-120 Q -30,-80 0,0" transform="rotate(30)" />
      <path d="M 0,0 Q 30,-80 0,-120 Q -30,-80 0,0" transform="rotate(60)" />
      <path d="M 0,0 Q 30,-80 0,-120 Q -30,-80 0,0" transform="rotate(90)" />
      <path d="M 0,0 Q 30,-80 0,-120 Q -30,-80 0,0" transform="rotate(120)" />
      <path d="M 0,0 Q 30,-80 0,-120 Q -30,-80 0,0" transform="rotate(150)" />
      <path d="M 0,0 Q 30,-80 0,-120 Q -30,-80 0,0" transform="rotate(180)" />
      <path d="M 0,0 Q 30,-80 0,-120 Q -30,-80 0,0" transform="rotate(210)" />
      <path d="M 0,0 Q 30,-80 0,-120 Q -30,-80 0,0" transform="rotate(240)" />
      <path d="M 0,0 Q 30,-80 0,-120 Q -30,-80 0,0" transform="rotate(270)" />
      <path d="M 0,0 Q 30,-80 0,-120 Q -30,-80 0,0" transform="rotate(300)" />
      <path d="M 0,0 Q 30,-80 0,-120 Q -30,-80 0,0" transform="rotate(330)" />
    </g>

    <!-- INNER LAYER: 6 thick, heavy petals for a dense "core" -->
    <g fill="#0665a4">
      <path d="M 0,0 Q 50,-50 0,-90 Q -50,-50 0,0" transform="rotate(0)" />
      <path d="M 0,0 Q 50,-50 0,-90 Q -50,-50 0,0" transform="rotate(60)" />
      <path d="M 0,0 Q 50,-50 0,-90 Q -50,-50 0,0" transform="rotate(120)" />
      <path d="M 0,0 Q 50,-50 0,-90 Q -50,-50 0,0" transform="rotate(180)" />
      <path d="M 0,0 Q 50,-50 0,-90 Q -50,-50 0,0" transform="rotate(240)" />
      <path d="M 0,0 Q 50,-50 0,-90 Q -50,-50 0,0" transform="rotate(300)" />
    </g>

    <!-- CENTRAL CORE: A solid circle to tie the whole shape together -->
    <circle cx="0" cy="0" r="25" fill="#0665a4" />
  </g>
</svg>
