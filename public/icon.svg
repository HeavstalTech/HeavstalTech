<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- 
    Heavstal Tech: Organic Sunflower Vortex
    Logic: Overlapping organic petal shapes with offset rotation to avoid 'star' geometry.
  -->
  <g transform="translate(200, 200)">
    
    <!-- OUTER BLOOM LAYER: 8 Large, sweeping petals, offset to fill gaps -->
    <g fill="#0665a4">
      <!-- We define one organic petal shape and rotate it with an offset -->
      <defs>
        <path id="petal-large" d="M 0,0 C 40,-60 80,-40 90,0 C 80,40 40,60 0,0" />
        <path id="petal-small" d="M 0,0 C 20,-30 35,-20 40,0 C 35,20 20,30 0,0" />
      </defs>
      
      <use href="#petal-large" transform="rotate(22.5)" />
      <use href="#petal-large" transform="rotate(67.5)" />
      <use href="#petal-large" transform="rotate(112.5)" />
      <use href="#petal-large" transform="rotate(157.5)" />
      <use href="#petal-large" transform="rotate(202.5)" />
      <use href="#petal-large" transform="rotate(247.5)" />
      <use href="#petal-large" transform="rotate(292.5)" />
      <use href="#petal-large" transform="rotate(337.5)" />
    </g>

    <!-- INNER CORE LAYER: 8 Small, dense petals to create the center weight -->
    <g fill="#0665a4">
      <use href="#petal-small" transform="rotate(0)" />
      <use href="#petal-small" transform="rotate(45)" />
      <use href="#petal-small" transform="rotate(90)" />
      <use href="#petal-small" transform="rotate(135)" />
      <use href="#petal-small" transform="rotate(180)" />
      <use href="#petal-small" transform="rotate(225)" />
      <use href="#petal-small" transform="rotate(270)" />
      <use href="#petal-small" transform="rotate(315)" />
    </g>

    <!-- CENTRAL HUB: A solid circle to anchor the entire emblem -->
    <circle cx="0" cy="0" r="25" fill="#0665a4" />
  </g>
</svg>
